<text x="394" y="134" font-size="15" font-weight="600" fill="#64748b" text-anchor="start">Python agent · LiveKit Agents · our server</text>
<rect x="364" y="148" width="504" height="204" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
<text x="384" y="182" font-size="21" font-weight="600" fill="#0f172a" text-anchor="start">GPT-Live session</text>
<text x="400" y="213" font-size="16" font-weight="600" fill="#0f172a" text-anchor="start">Conversation</text>
<text x="532" y="213" font-size="16" font-weight="400" fill="#334155" text-anchor="start">full-duplex speech with the wearer;</text>
<text x="532" y="234" font-size="16" font-weight="400" fill="#334155" text-anchor="start">takes audio only, no camera</text>
<text x="400" y="263" font-size="16" font-weight="600" fill="#0f172a" text-anchor="start">Step guidance</text>
<text x="532" y="263" font-size="16" font-weight="400" fill="#334155" text-anchor="start">tells each step from the build plan</text>
<text x="532" y="284" font-size="16" font-weight="400" fill="#334155" text-anchor="start">written into its prompt</text>
<text x="400" y="313" font-size="16" font-weight="600" fill="#0f172a" text-anchor="start">Hand-off</text>
<text x="532" y="313" font-size="16" font-weight="400" fill="#334155" text-anchor="start">sends a delegation when an answer</text>
<text x="532" y="334" font-size="16" font-weight="400" fill="#334155" text-anchor="start">needs the camera</text>
<rect x="364" y="456" width="504" height="254" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
<text x="384" y="490" font-size="21" font-weight="600" fill="#0f172a" text-anchor="start">Brain</text>
<text x="400" y="521" font-size="16" font-weight="600" fill="#0f172a" text-anchor="start">Watch</text>
<text x="532" y="521" font-size="16" font-weight="400" fill="#334155" text-anchor="start">looks at the newest frame by itself,</text>
<text x="532" y="542" font-size="16" font-weight="400" fill="#334155" text-anchor="start">at most every 2 s; 768 px, no thinking</text>
<text x="400" y="571" font-size="16" font-weight="600" fill="#0f172a" text-anchor="start">Answer</text>
<text x="532" y="571" font-size="16" font-weight="400" fill="#334155" text-anchor="start">looks at the newest frame for each</text>
<text x="532" y="592" font-size="16" font-weight="400" fill="#334155" text-anchor="start">delegation; 1080 px, with thinking</text>
<text x="400" y="621" font-size="16" font-weight="600" fill="#0f172a" text-anchor="start">Progress</text>
<text x="532" y="621" font-size="16" font-weight="400" fill="#334155" text-anchor="start">records how many steps are built right</text>
<text x="532" y="642" font-size="16" font-weight="400" fill="#334155" text-anchor="start">(set_progress), updates the step list</text>
<text x="400" y="671" font-size="16" font-weight="600" fill="#0f172a" text-anchor="start">Context</text>
<text x="532" y="671" font-size="16" font-weight="400" fill="#334155" text-anchor="start">every look sends the call's transcript and</text>
<text x="532" y="692" font-size="16" font-weight="400" fill="#334155" text-anchor="start">its own earlier notes, no old images</text>
<path d="M394 358 L394 450" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#headm)"/>
<path d="M564 450 L564 358" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#headm)"/>
<path d="M736 450 L736 358" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#headm)"/>
<text x="406" y="392.0" font-size="16" font-weight="600" fill="#0f172a" text-anchor="start">delegation</text>
<text x="406" y="412.0" font-size="15" font-weight="400" fill="#334155" text-anchor="start">a question that</text>
<text x="406" y="431.0" font-size="15" font-weight="400" fill="#334155" text-anchor="start">needs the camera</text>
<text x="576" y="392.0" font-size="16" font-weight="600" fill="#0f172a" text-anchor="start">commentary</text>
<text x="576" y="412.0" font-size="15" font-weight="400" fill="#334155" text-anchor="start">spoken: answers,</text>
<text x="576" y="431.0" font-size="15" font-weight="400" fill="#334155" text-anchor="start">corrections, progress</text>
<text x="748" y="392.0" font-size="16" font-weight="600" fill="#0f172a" text-anchor="start">thinking</text>
<text x="748" y="412.0" font-size="15" font-weight="400" fill="#334155" text-anchor="start">notes, not spoken</text>
