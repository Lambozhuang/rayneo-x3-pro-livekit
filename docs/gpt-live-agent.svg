<text x="261.0" y="545.0" font-size="15" font-weight="400" fill="#334155" text-anchor="middle">1080x1920, 15 fps</text>
<path d="M358 623.0 L164 623.0" fill="none" stroke="#0369a1" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#head)"/>
<text x="261.0" y="594.0" font-size="15" font-weight="400" fill="#334155" text-anchor="middle">step list,</text>
<text x="261.0" y="613.0" font-size="15" font-weight="400" fill="#334155" text-anchor="middle">participant attributes</text>
