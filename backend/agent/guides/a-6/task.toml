# Game A of the user study, "pick the brick", trial 6 of 6 (gpt/pick.py; the spec is the study's game-spec.md outside the
# repo). A tray holds one 2x4 brick of each of six colours; the agent names a colour, the user holds that brick up, the
# Decisions line says whether it is the one, four times, then the user asks which bricks they picked. Each step is one
# pick: `brick` is the colour named, `name` is what the step list on the glasses shows, which does not give the colour
# away. The six trials name four of the six colours each, no two trials the same four or the same order; the first four
# trials are the console's experiment runs 1 to 4, the last two its training runs 1 and 2 (Lab.kt). No pictures:
# `game = "pick"` has nothing to show.

game = "pick"
title = "Pick the brick, trial 6"
number = 206

[[steps]]
name = "Brick 1"
brick = "blue 2x4"
place = ""
color = "#1e5bc6"

