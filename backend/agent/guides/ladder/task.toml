# A ladder: a tan and a white 1x6 for the rails, three 1x4 rungs between them, yellow, blue and lime. From tasks/sheet.html, task 1.
#
# Each step: `name` for the step list on the glasses; `brick`, which brick; `place`, where it goes, against the bricks
# before it (step 1 only roughly on the plate). Both models get `brick` and `place`. `color` and `cells` draw the step's
# picture on the glasses and go to no model: `color` is the brick's colour as tasks/sheet.html draws it; `cells` is the
# brick's footprint as drawn on the sheet, [col0, row0, col1, row1] inclusive, columns 1..16 left to right, rows 1..16
# from the far edge; a brick named `round plate` covers its 4x4 square but not the corners and is drawn as a disc.
# Directions: the plate as a picture lying in front of the wearer, up = the far edge; vertical = the long side runs up
# and down.

title = "LEGO ladder on a baseplate"
plate = 16
number = 1

[[steps]]
name = "Tan 1x6, left side"
brick = "tan 1x6"
color = "#d9c89b"
place = "vertical, roughly in the middle of the plate, a little left of centre"
cells = [5, 5, 5, 10]

[[steps]]
name = "White 1x6, right side"
brick = "white 1x6"
color = "#f2f2f2"
place = "vertical, right of the tan brick, level with it, four empty columns between them"
cells = [10, 5, 10, 10]

[[steps]]
name = "Yellow 1x4, top rung"
brick = "yellow 1x4"
color = "#f2c20a"
place = "horizontal, between the tan and white bricks in their top row, touching both"
cells = [6, 5, 9, 5]

[[steps]]
name = "Blue 1x4, middle rung"
brick = "blue 1x4"
color = "#1e5bc6"
place = "horizontal, between the tan and white bricks, touching both, one empty row between it and the yellow brick"
cells = [6, 7, 9, 7]

[[steps]]
name = "Lime 1x4, bottom rung"
brick = "lime 1x4"
color = "#9ccc3c"
place = "horizontal, between the tan and white bricks, touching both, one empty row between it and the blue brick"
cells = [6, 9, 9, 9]
