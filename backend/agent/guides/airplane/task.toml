# An airplane: a tan 2x6 body, a red and a blue 2x4 for the wings, a purple 2x4 tail, a dark grey 2x6 tail wing. From tasks/sheet.html (the 5-step shortlist), task 10.
#
# Grid: columns 1..16 left to right, rows 1..16 from the far edge to the edge nearest the builder. `cells` is the
# brick's footprint [col0, row0, col1, row1], inclusive: the layout as drawn. Where the build sits on the
# plate is loose (step 1 says roughly where, so the rest fits); how the five bricks sit against each other is exact.
# Every step is two parts for the wearer: `find` (which brick to pick up) and, once they have it, `place` (where it
# goes). `where` and `checks` are what the brain checks a photo against. One vocabulary throughout: the plate as a
# picture lying in front of the wearer, up = the far edge, down = the near edge, left and right theirs, a brick
# vertical (long side up-down) or horizontal (left-right).

title = "LEGO airplane on a baseplate"
plate = 16
number = 10

[[steps]]
part = "tan 2x6 brick"
name = "Tan 2x6, body"
color = "tan"
cells = [8, 3, 9, 8]
find = "Find the tan two-by-six: a long tan brick, two studs wide and six studs long."
place = "Lay it vertically near the top of the plate, centred left to right."
where = "the tan 2x6, vertical (2 studs left-right, 6 up-down), near the top of the plate, centred left to right; the airplane needs six rows below it and four columns on each side"
checks = [
  "it is vertical and tan",
  "it lies near the top of the plate, with at most four empty rows above it",
  "it is roughly centred left to right, with at least four empty columns on either side",
]

[[steps]]
part = "red 2x4 brick"
name = "Red 2x4, left wing"
color = "red"
cells = [4, 6, 7, 7]
find = "Find a red two-by-four: a red brick, two studs wide and four studs long."
place = "Lay it horizontally against the left side of the tan brick, touching it, with one row of the tan brick left below it."
where = "the red 2x4, horizontal, touching the left side of the tan brick, its bottom edge one row above the tan brick's bottom end"
checks = [
  "it is horizontal and red",
  "it touches the left side of the tan brick",
  "its bottom edge is one row above the bottom end of the tan brick",
]

[[steps]]
part = "blue 2x4 brick"
name = "Blue 2x4, right wing"
color = "blue"
cells = [10, 6, 13, 7]
find = "Find a blue two-by-four: a blue brick, two studs wide and four studs long."
place = "Lay it horizontally against the right side of the tan brick, in the same rows as the red one."
where = "the blue 2x4, horizontal, touching the right side of the tan brick, in the same rows as the red brick"
checks = [
  "it is horizontal and blue",
  "it touches the right side of the tan brick",
  "it is in the same rows as the red brick",
]

[[steps]]
part = "purple 2x4 brick"
name = "Purple 2x4, tail"
color = "purple"
cells = [8, 9, 9, 12]
find = "Find the purple two-by-four: a purple brick, two studs wide and four studs long."
place = "Stand it vertically under the tan brick, touching its bottom end, lined up with it."
where = "the purple 2x4, vertical, touching the bottom end of the tan brick, in the same columns"
checks = [
  "it is vertical and purple",
  "it touches the bottom end of the tan brick",
  "it is in the same columns as the tan brick",
]

[[steps]]
part = "dark grey 2x6 brick"
name = "Dark grey 2x6, tail wing"
color = "dgrey"
cells = [6, 13, 11, 14]
find = "Find the dark grey two-by-six: a long dark grey brick, two studs wide and six studs long."
place = "Lay it horizontally under the purple brick, touching it, centred, with two studs sticking out on each side."
where = "the dark grey 2x6, horizontal, touching the bottom end of the purple brick, centred under it, two columns sticking out on each side"
checks = [
  "it is horizontal and dark grey",
  "it touches the bottom end of the purple brick",
  "it is centred under the purple brick, two columns sticking out on each side",
]
