# A cat: a tan 2x6 body, a purple 2x4 head, a white 1x6 tail, a blue and a yellow 1x4 for the legs. From tasks/sheet.html, task 12.
#
# Each step: `name` for the step list on the glasses; `brick`, which brick; `place`, where it goes, against the bricks
# before it (step 1 only roughly on the plate). Both models get `brick` and `place`. `color` and `cells` draw the step's
# picture on the glasses and go to no model: `color` is the brick's colour as tasks/sheet.html draws it; `cells` is the
# brick's footprint as drawn on the sheet, [col0, row0, col1, row1] inclusive, columns 1..16 left to right, rows 1..16
# from the far edge; a brick named `round plate` covers its 4x4 square but not the corners and is drawn as a disc.
# Directions: the plate as a picture lying in front of the wearer, up = the far edge; vertical = the long side runs up
# and down.

title = "LEGO cat on a baseplate"
plate = 16
number = 12

[[steps]]
name = "Tan 2x6, body"
brick = "tan 2x6"
color = "#d9c89b"
place = "horizontal, roughly in the middle of the plate"
cells = [5, 8, 10, 9]

[[steps]]
name = "Purple 2x4, head"
brick = "purple 2x4"
color = "#5a2d91"
place = "vertical, touching the right end of the tan brick, its bottom end level with the tan brick's bottom edge"
cells = [11, 6, 12, 9]

[[steps]]
name = "White 1x6, tail"
brick = "white 1x6"
color = "#f2f2f2"
place = "vertical, touching the left end of the tan brick, its bottom end level with the tan brick's top row"
cells = [4, 3, 4, 8]

[[steps]]
name = "Blue 1x4, front leg"
brick = "blue 1x4"
color = "#1e5bc6"
place = "vertical, below the left end of the tan brick, touching it, lined up with the tan brick's left end"
cells = [5, 10, 5, 13]

[[steps]]
name = "Yellow 1x4, back leg"
brick = "yellow 1x4"
color = "#f2c20a"
place = "vertical, below the right end of the tan brick, touching it, lined up with the tan brick's right end"
cells = [10, 10, 10, 13]
