# A crane: a dark grey 2x6 base, a tan 1x6 mast, a white 1x6 jib, a yellow 1x4 cable and a red 2x4 load. From tasks/sheet.html, task 3.
#
# Each step: `name` for the step list on the glasses; `brick`, which brick; `place`, where it goes, against the bricks
# before it (step 1 only roughly on the plate). Both models get `brick` and `place`. `cells` is the brick's footprint
# as drawn on the sheet, [col0, row0, col1, row1] inclusive, columns 1..16 left to right, rows 1..16 from the far
# edge; it goes to no model. Directions: the plate as a picture lying in front of the wearer, up = the far
# edge; vertical = the long side runs up and down.

title = "LEGO crane on a baseplate"
plate = 16
number = 3

[[steps]]
name = "Dark grey 2x6, base"
brick = "dark grey 2x6"
place = "horizontal, in the lower half of the plate, a little left of centre"
cells = [4, 13, 9, 14]

[[steps]]
name = "Tan 1x6, mast"
brick = "tan 1x6"
place = "vertical, above the dark grey brick, touching it, in its third column from the left"
cells = [6, 7, 6, 12]

[[steps]]
name = "White 1x6, jib"
brick = "white 1x6"
place = "horizontal, touching the top end of the tan brick, its left end in the tan brick's column"
cells = [6, 6, 11, 6]

[[steps]]
name = "Yellow 1x4, cable"
brick = "yellow 1x4"
place = "vertical, below the right end of the white brick, touching it"
cells = [11, 7, 11, 10]

[[steps]]
name = "Red 2x4, load"
brick = "red 2x4"
place = "horizontal, touching the bottom end of the yellow brick, one of its columns left of the yellow brick and two right"
cells = [10, 11, 13, 12]
