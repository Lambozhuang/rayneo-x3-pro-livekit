# The letter E: a dark grey 2x6 spine, a blue and a tan 2x6 for the top and bottom bars, a white and a lime 1x4 for the middle bar. From tasks/sheet.html, task 13.
#
# Each step: `name` for the step list on the glasses; `brick`, which brick; `place`, where it goes, against the bricks
# before it (step 1 only roughly on the plate). Both models get `brick` and `place`. `color` and `cells` draw the step's
# picture on the glasses and go to no model: `color` is the brick's colour as tasks/sheet.html draws it; `cells` is the
# brick's footprint as drawn on the sheet, [col0, row0, col1, row1] inclusive, columns 1..16 left to right, rows 1..16
# from the far edge; a brick named `round plate` covers its 4x4 square but not the corners and is drawn as a disc.
# Directions: the plate as a picture lying in front of the wearer, up = the far edge; vertical = the long side runs up
# and down.

title = "LEGO letter E on a baseplate"
plate = 16
number = 13

[[steps]]
name = "Dark grey 2x6, spine"
brick = "dark grey 2x6"
color = "#555555"
place = "vertical, roughly in the middle of the plate, a little left of centre"
cells = [5, 5, 6, 10]

[[steps]]
name = "Blue 2x6, top bar"
brick = "blue 2x6"
color = "#1e5bc6"
place = "horizontal, above the dark grey brick, touching its top end, its left end lined up with the dark grey brick's left side"
cells = [5, 3, 10, 4]

[[steps]]
name = "White 1x4, middle bar"
brick = "white 1x4"
color = "#f2f2f2"
place = "horizontal, touching the right side of the dark grey brick, two empty rows between it and the blue brick"
cells = [7, 7, 10, 7]

[[steps]]
name = "Lime 1x4, below white"
brick = "lime 1x4"
color = "#9ccc3c"
place = "horizontal, below the white brick, touching it, in the same columns"
cells = [7, 8, 10, 8]

[[steps]]
name = "Tan 2x6, bottom bar"
brick = "tan 2x6"
color = "#d9c89b"
place = "horizontal, below the dark grey brick, touching its bottom end, its left end lined up with the dark grey brick's left side"
cells = [5, 11, 10, 12]
