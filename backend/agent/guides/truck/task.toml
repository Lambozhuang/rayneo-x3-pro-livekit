# The truck: 13 bricks laid flat on a 16x16 green baseplate, one layer, in the
# order below. One file for the agent (guide.py) and for the offline evaluation
# in eval/ (common.load), so the layout the judge compares against and the
# steps the wearer hears cannot drift apart.
#
# Grid: columns 1..16 left to right, rows 1..16 from the far edge to the edge
# nearest the builder (the camera looks from the row-16 side). `cells` is the
# brick's footprint [col0, row0, col1, row1], inclusive. Discs are round: their
# four corner cells are not counted. `say` is what the wearer hears ("toward
# you" is allowed there); `where` and `checks` are the camera-independent
# wording for the VLM judge, and `color`/`cells` drive the CV judge.
# CV judge colour names: red purple lime white blue tan yellow.

title = "LEGO truck on a baseplate"
plate = 16

[[steps]]
part = "red 3x4 slope"
name = "Red slope, left edge"
color = "red"
cells = [1, 6, 4, 8]
say = "Take the red three-by-four slope and press it flat against the left edge of the plate, sloped face up, slope facing left. Leave about five empty rows beyond it and eight rows toward you."
where = "the red 3x4 slope brick, sloped face up, against the left edge of the plate, with several rows of empty plate above it and below it"
checks = [
  "the brick touches the left edge of the plate",
  "it is red",
  "there are empty studs both above it and below it (it touches neither the top nor the bottom edge of the plate)",
]

[[steps]]
part = "purple 2x4 brick"
name = "Purple 2x4 cab, right of slope"
color = "purple"
cells = [5, 5, 6, 8]
say = "Now the purple two-by-four. Lay it flat directly to the right of the red slope, touching it, long side running away from you. Its near end lines up with the red brick's near end, so it reaches one stud further away than the red brick."
where = "the purple 2x4 brick lying flat with its long side running front to back (2 studs wide, 4 studs deep), directly to the right of the red slope and touching it; its bottom is level with the red brick's bottom and it reaches one stud further up than the red brick"
checks = [
  "the purple brick touches the right side of the red slope",
  "its long side runs front to back (it is deeper than it is wide), not left to right",
  "it reaches one stud further up than the red brick",
]

[[steps]]
part = "lime green 1x2 brick"
name = "Lime 1x2 exhaust, far right of cab"
color = "lime"
cells = [7, 4, 7, 5]
say = "Take a small lime green one-by-two. Put it flat right next to the purple brick's far right corner, long side running away from you, so it sticks out one stud past the purple brick like an exhaust pipe."
where = "the small lime-green 1x2 brick lying flat with its long side running front to back (1 wide, 2 deep), immediately to the right of the purple brick at its upper corner, reaching one stud further up than the purple brick like an exhaust pipe"
checks = [
  "the lime brick touches the right side of the purple brick",
  "its long side runs front to back, not left to right",
  "it reaches one stud further up than the purple brick",
]

[[steps]]
part = "white 1x6 brick"
name = "White 1x6 top, right of cab"
color = "white"
cells = [7, 6, 12, 6]
say = "Now a white one-by-six. Lay it flat to the right of the purple brick, running left to right, its left end touching the purple brick, just in front of the lime exhaust."
where = "the first white 1x6 brick lying flat, directly to the right of the purple brick with its left end touching the purple brick, just under the lime exhaust (the exhaust sits on top of its left end)"
checks = [
  "the brick is pure white, not beige or cream",
  "it is horizontal, 6 studs long",
  "its left end touches the purple brick",
]

[[steps]]
part = "white 1x6 brick"
name = "White 1x6 middle, in front of first"
color = "white"
cells = [7, 7, 12, 7]
say = "Another white one-by-six. Put it flat directly in front of the first white one, toward you, touching it, so the white part is two rows deep with a straight right end."
where = "another white 1x6 brick lying flat directly in front of the first white brick (toward the builder), so that the white area to the right of the purple brick becomes two rows of studs deep, a 2x6 white block whose left end touches the purple brick and whose right end is straight"
checks = [
  "the white area to the right of the purple brick has two rows of studs from front to back, not one",
  "the white area's left end touches the purple brick",
  "the white area's right end is straight: both rows end at the same place",
]

[[steps]]
part = "blue 1x4 brick"
name = "Blue 1x4 in front of white, left"
color = "blue"
cells = [7, 8, 10, 8]
say = "Take the blue one-by-four. Lay it flat directly in front of the lower white brick, its left end touching the purple brick. It is shorter than the white bricks, so two studs stay empty at its right."
where = "the blue 1x4 brick lying flat directly under the lower white brick, its left end touching the purple brick, its right end stopping two studs short of the white bricks' right end; its bottom is level with the bottom of the red and purple bricks"
checks = [
  "the blue brick's left end touches the purple brick",
  "it sits directly under the lower white brick with no gap",
  "its right end is two studs short of the white bricks' right end",
]

[[steps]]
part = "lime green 1x2 brick"
name = "Lime 1x2 right of blue"
color = "lime"
cells = [11, 8, 12, 8]
say = "Now the other lime green one-by-two. Put it flat to the right of the blue brick, touching it, running left to right, so that row ends level with the white bricks."
where = "the lime-green 1x2 brick lying flat to the right of the blue brick and touching it, filling the row so that its right end lines up with the white bricks' right end"
checks = [
  "the lime brick touches the right end of the blue brick",
  "it is horizontal, in the same row as the blue brick",
  "its right end lines up with the right end of the white bricks above",
]

[[steps]]
part = "white 1x4 brick"
name = "White 1x4 right end, front to back"
color = "white"
cells = [13, 5, 13, 8]
say = "Take the white one-by-four. Lay it flat against the right end of the body, long side running away from you, touching the ends of the two white bricks and the lime one. It reaches one stud further away than the top white brick."
where = "the white 1x4 brick lying flat with its long side running front to back (1 wide, 4 deep) against the right end of the body, touching the ends of the two white bricks and the lime brick; it reaches one stud further up than the top white brick and its bottom is level with the body's bottom"
checks = [
  "its long side runs front to back (it is deeper than it is wide), not left to right",
  "it touches the right ends of the white bricks and the lime brick",
  "it reaches one stud further up than the top white brick",
]

[[steps]]
part = "red 4x4 round disc"
name = "Red disc front wheel, under slope"
color = "red"
cells = [1, 9, 4, 12]
say = "Now a red round disc, four studs across. Put it directly in front of the red slope, touching it, against the left edge of the plate, like the front wheel."
where = "the red round disc (4 studs across) directly under the red slope, touching its bottom edge, same width as the slope, against the left edge of the plate, like a front wheel"
checks = [
  "the disc touches the bottom edge of the red slope",
  "it is as wide as the red slope and lined up with it",
  "it touches the left edge of the plate",
]

[[steps]]
part = "red 4x4 round disc"
name = "Red disc rear wheel, under body"
color = "red"
cells = [8, 9, 11, 12]
say = "The second red disc is the rear wheel. Put it in front of the body, touching the blue and lime bricks, leaving three empty columns between it and the front wheel. The plate stays bare in front of the white brick at the right end."
where = "the second red round disc under the right part of the body as the rear wheel: its top touches the blue and lime bricks, its right edge stays left of the lime brick's right end, and bare green plate shows directly below the white 1x4 at the right end of the body"
checks = [
  "the disc's top touches the bottom of the body (the blue and lime bricks)",
  "directly below the white 1x4 at the right end of the body there is bare green plate, not the disc",
  "the disc's right edge is to the left of the lime brick's right end",
]

[[steps]]
part = "tan 1x6 brick"
name = "Tan 1x6 ground, left"
color = "tan"
cells = [1, 13, 6, 13]
say = "Take the tan one-by-six, the beige one. Lay it flat directly in front of the front wheel, touching it, its left end at the left edge of the plate. This is the ground."
where = "the tan (beige) 1x6 brick lying flat directly under the front disc, its left end at the left edge of the plate, like the ground line"
checks = [
  "the brick is beige/tan, not white",
  "it is horizontal and lies directly under the front disc",
  "its left end is at the left edge of the plate",
]

[[steps]]
part = "white 1x6 brick"
name = "White 1x6 ground, middle"
color = "white"
cells = [7, 13, 12, 13]
say = "Now a white one-by-six on the ground. Put it in the same row as the tan brick, touching its right end, running under the rear wheel."
where = "the white 1x6 brick lying flat in the same row as the tan brick, continuing it to the right and touching it, running under the rear disc"
checks = [
  "the brick is pure white",
  "it is in the same row as the tan brick and touches its right end",
  "it runs under the rear disc",
]

[[steps]]
part = "yellow 1x4 brick"
name = "Yellow 1x4 ground, right"
color = "yellow"
cells = [13, 13, 16, 13]
say = "Last one: the yellow one-by-four. Put it in the same row, touching the right end of the white ground brick, so the row runs all the way to the right edge of the plate."
where = "the yellow 1x4 brick lying flat in the same row, continuing the white ground brick to the right and touching it, filling the row to the last stud column of the plate below the white 1x4 at the right end of the body"
checks = [
  "the brick is yellow",
  "it is in the same row as the white ground brick and touches its right end",
  "its right end is at the right edge of the plate: no empty studs to its right in that row (the brick may look flush with or slightly past the plate's edge)",
]
