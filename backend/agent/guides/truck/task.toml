# The truck: 13 bricks laid flat on a 16x16 green baseplate, one layer, in the
# order below. One file for the agent (guide.py) and for the offline evaluation
# in eval/ (common.load), so the layout the judge compares against and the
# steps the wearer hears cannot drift apart.
#
# Grid: columns 1..16 left to right, rows 1..16 from the far edge to the edge
# nearest the builder (the camera looks from the row-16 side). `cells` is the
# brick's footprint [col0, row0, col1, row1], inclusive. Discs are round: their
# four corner cells are not counted. `say` is what the wearer hears, `where`
# and `checks` what the brain checks the photo against; all three use one
# vocabulary: the plate as a picture lying in front of the wearer, up = the far
# edge, down = the near edge, left and right theirs, and a brick is vertical
# (long side up-down) or horizontal (left-right). `color`/`cells` drive the CV
# judge; every `color` must have a centre in every [colours.<camera>] table.

title = "LEGO truck on a baseplate"
plate = 16

# Colour centres for the CV judge: chromaticity (r, g, b) / (r + g + b) of each brick colour and of the plate,
# median over the cells of the finished model in one frame. They depend on the camera pipeline, so one table per
# camera, chosen with JUDGE_COLOURS (the agent defaults to "livekit"; eval/ uses "camera-app"):
#   camera-app  the glasses' stock camera app, which recorded eval/truck (1080p15 frames; full resolution agreed
#               within 0.01): deep green plate, muted bricks
#   livekit     the app's live call stream (camerax -> H.264) in the lab: pale mint plate, vivid bricks
# Recompute with `python eval/cv_judge.py calibrate <frame> [--steps N]` when the bricks, camera or lighting change.
[colours.camera-app]
plate = [0.194, 0.535, 0.268]
red = [0.615, 0.199, 0.185]
purple = [0.341, 0.274, 0.385]
lime = [0.383, 0.481, 0.134]
white = [0.339, 0.341, 0.319]
blue = [0.171, 0.346, 0.483]
tan = [0.397, 0.354, 0.246]
yellow = [0.571, 0.392, 0.035]

[colours.livekit]
# median over five whole-plate frames of the finished model in the lab, 2026-10-06 (spread <= 0.008 per channel)
plate = [0.307, 0.41, 0.284]
red = [0.814, 0.143, 0.041]
purple = [0.399, 0.277, 0.327]
lime = [0.454, 0.391, 0.154]
white = [0.373, 0.332, 0.295]
blue = [0.258, 0.321, 0.418]
tan = [0.443, 0.34, 0.217]
yellow = [0.578, 0.417, 0.002]

[[steps]]
part = "red 3x4 slope"
name = "Red slope, left edge"
color = "red"
cells = [1, 6, 4, 8]
say = "Take the red three-by-four slope. Lay it horizontally against the left edge of the plate, slope side showing. Leave about five empty rows above it and eight below it."
where = "the red 3x4 slope, horizontal (4 studs left-right, 3 up-down), against the left edge of the plate, with empty plate above and below it; seen from above, a slope looks like a flat red rectangle, which is expected: do not judge its slope"
checks = [
  "it touches the left edge of the plate",
  "it is red",
  "there are empty studs both above and below it (it touches neither the top nor the bottom edge of the plate)",
]

[[steps]]
part = "purple 2x4 brick"
name = "Purple 2x4 cab, right of slope"
color = "purple"
cells = [5, 5, 6, 8]
say = "Now the purple two-by-four. Lay it vertically, directly right of the red slope and touching it. Its bottom lines up with the slope's bottom, so it sticks out one stud above the slope."
where = "the purple 2x4, vertical (2 studs left-right, 4 up-down), directly right of the red slope and touching it; its bottom level with the slope's bottom, its top one stud above the slope's top"
checks = [
  "it touches the right side of the red slope",
  "it is vertical: taller than it is wide",
  "its top is one stud above the red slope's top",
]

[[steps]]
part = "lime green 1x2 brick"
name = "Lime 1x2 exhaust, top right of cab"
color = "lime"
cells = [7, 4, 7, 5]
say = "Take a small lime green one-by-two. Lay it vertically right of the purple brick at its top corner, sticking out one stud above the purple brick, like an exhaust pipe."
where = "the lime 1x2, vertical (1 stud left-right, 2 up-down), touching the right side of the purple brick at its top, its top one stud above the purple brick's top"
checks = [
  "it touches the right side of the purple brick",
  "it is vertical, not horizontal",
  "its top is one stud above the purple brick's top",
]

[[steps]]
part = "white 1x6 brick"
name = "White 1x6 top, right of cab"
color = "white"
cells = [7, 6, 12, 6]
say = "Now a white one-by-six. Lay it horizontally right of the purple brick, its left end touching the purple brick, just below the lime exhaust."
where = "the first white 1x6, horizontal, right of the purple brick with its left end touching it, directly below the lime exhaust"
checks = [
  "it is pure white, not beige or cream",
  "it is horizontal, 6 studs long",
  "its left end touches the purple brick",
]

[[steps]]
part = "white 1x6 brick"
name = "White 1x6, below the first"
color = "white"
cells = [7, 7, 12, 7]
say = "Another white one-by-six. Lay it horizontally directly below the first white one, touching it, so the white part is two rows tall with a straight right end."
where = "a second white 1x6, horizontal, directly below the first white brick and touching it: the white area right of the purple brick becomes a 2x6 block, its left end touching the purple brick, its right end straight"
checks = [
  "the white area right of the purple brick is two rows tall, not one",
  "its left end touches the purple brick",
  "its right end is straight: both rows end at the same place",
]

[[steps]]
part = "blue 1x4 brick"
name = "Blue 1x4 below white, left"
color = "blue"
cells = [7, 8, 10, 8]
say = "Take the blue one-by-four. Lay it horizontally directly below the lower white brick, its left end touching the purple brick. It is shorter, so two studs stay empty at its right."
where = "the blue 1x4, horizontal, directly below the lower white brick, its left end touching the purple brick, its right end two studs short of the white bricks' right end; its bottom level with the bottoms of the red and purple bricks"
checks = [
  "its left end touches the purple brick",
  "it is directly below the lower white brick, with no gap",
  "its right end is two studs short of the white bricks' right end",
]

[[steps]]
part = "lime green 1x2 brick"
name = "Lime 1x2 right of blue"
color = "lime"
cells = [11, 8, 12, 8]
say = "Now the other lime green one-by-two. Lay it horizontally right of the blue brick, touching it, so that row ends level with the white bricks."
where = "the lime 1x2, horizontal, right of the blue brick and touching it, its right end lined up with the white bricks' right end"
checks = [
  "it touches the right end of the blue brick",
  "it is horizontal, in the blue brick's row",
  "its right end lines up with the white bricks' right end",
]

[[steps]]
part = "white 1x4 brick"
name = "White 1x4 right end, vertical"
color = "white"
cells = [13, 5, 13, 8]
say = "Take the white one-by-four. Lay it vertically against the right end of the body, touching the ends of the two white bricks and the lime one. It sticks out one stud above the top white brick."
where = "the white 1x4, vertical (1 stud left-right, 4 up-down), against the right end of the body, touching the right ends of both white bricks and the lime brick; its top one stud above the top white brick, its bottom level with the body's bottom"
checks = [
  "it is vertical: taller than it is wide",
  "it touches the right ends of the white bricks and the lime brick",
  "its top is one stud above the top white brick",
]

[[steps]]
part = "red 4x4 round disc"
name = "Red disc left wheel, below slope"
color = "red"
cells = [1, 9, 4, 12]
say = "Now a red round disc, four studs across. Put it directly below the red slope, touching it, against the left edge of the plate. That's the left wheel."
where = "the red round disc (4 studs across) directly below the red slope, touching it, as wide as the slope and lined up with it, against the left edge of the plate: the left wheel"
checks = [
  "it touches the bottom of the red slope",
  "it is as wide as the red slope and lined up with it",
  "it touches the left edge of the plate",
]

[[steps]]
part = "red 4x4 round disc"
name = "Red disc right wheel, below body"
color = "red"
cells = [8, 9, 11, 12]
say = "The second red disc is the right wheel. Put it below the body, touching the blue and lime bricks, with three empty columns between it and the left wheel. The plate stays bare below the white brick at the right end."
where = "the second red disc below the body, the right wheel: its top touches the right part of the blue brick and the left part of the lime brick, three empty columns of studs separate it from the left wheel, and bare plate shows directly below the white 1x4 at the right end"
checks = [
  "its top touches both the right part of the blue brick and the left part of the lime brick",
  "there are three empty columns of studs between the left wheel and this disc",
  "directly below the white 1x4 at the right end there is bare plate, not the disc",
]

[[steps]]
part = "tan 1x6 brick"
name = "Tan 1x6 ground, left"
color = "tan"
cells = [1, 13, 6, 13]
say = "Take the tan one-by-six, the beige one. Lay it horizontally directly below the left wheel, touching it, its left end at the left edge of the plate. This is the ground."
where = "the tan (beige) 1x6, horizontal, directly below the left wheel, its left end at the left edge of the plate: the ground line"
checks = [
  "it is beige/tan, not white",
  "it is horizontal, directly below the left wheel",
  "its left end is at the left edge of the plate",
]

[[steps]]
part = "white 1x6 brick"
name = "White 1x6 ground, middle"
color = "white"
cells = [7, 13, 12, 13]
say = "Now a white one-by-six. Lay it horizontally in the same row as the tan brick, touching its right end; it runs below the right wheel."
where = "the white 1x6, horizontal, in the tan brick's row, touching its right end, running below the right wheel"
checks = [
  "it is pure white",
  "it is in the tan brick's row and touches its right end",
  "it runs below the right wheel",
]

[[steps]]
part = "yellow 1x4 brick"
name = "Yellow 1x4 ground, right"
color = "yellow"
cells = [13, 13, 16, 13]
say = "Last one: the yellow one-by-four. Lay it in the same row, touching the right end of the white ground brick, so the row reaches the right edge of the plate."
where = "the yellow 1x4, horizontal, in the ground row, touching the right end of the white ground brick, filling the row to the right edge of the plate, below the white 1x4 at the right end of the body"
checks = [
  "it is yellow",
  "it is in the white ground brick's row and touches its right end",
  "its right end is at the right edge of the plate, no empty studs to its right in that row (it may look flush with or slightly past the edge)",
]
