# A fish: a blue 2x6 body, a dark grey 4x4 round head, a red 2x4 tail, a pink and a lavender 2x4 for the fins. From tasks/sheet.html, task 6.
#
# Each step: `name` for the step list on the glasses; `brick`, which brick; `place`, where it goes, against the bricks
# before it (step 1 only roughly on the plate). Both models get `brick` and `place`. `cells` is the brick's footprint
# as drawn on the sheet, [col0, row0, col1, row1] inclusive, columns 1..16 left to right, rows 1..16 from the far
# edge; a round plate covers its 4x4 square but not the corners; it goes to no model. Directions: the plate as a picture lying in front of the wearer, up = the far
# edge; vertical = the long side runs up and down.

title = "LEGO fish on a baseplate"
plate = 16
number = 6

[[steps]]
name = "Blue 2x6, body"
brick = "blue 2x6"
place = "horizontal, roughly in the middle of the plate, a little right of centre"
cells = [7, 7, 12, 8]

[[steps]]
name = "Dark grey round, head"
brick = "dark grey 4x4 round plate"
place = "touching the left end of the blue brick, reaching one row above it and one row below it"
cells = [3, 6, 6, 9]

[[steps]]
name = "Red 2x4, tail"
brick = "red 2x4"
place = "vertical, touching the right end of the blue brick, reaching one row above it and one row below it"
cells = [13, 6, 14, 9]

[[steps]]
name = "Pink 2x4, top fin"
brick = "pink 2x4"
place = "horizontal, above the blue brick, touching it, one blue column free at each end"
cells = [8, 5, 11, 6]

[[steps]]
name = "Lavender 2x4, bottom fin"
brick = "lavender 2x4"
place = "horizontal, below the blue brick, touching it, in the same columns as the pink brick"
cells = [8, 9, 11, 10]
