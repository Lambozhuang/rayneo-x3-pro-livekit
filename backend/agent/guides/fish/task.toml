# A fish: a blue 2x6 body, a dark grey 4x4 round head, a red 2x4 tail, a pink and a lavender 2x4 for the fins. From tasks/sheet.html (the 5-step shortlist), task 6.
#
# Grid: columns 1..16 left to right, rows 1..16 from the far edge to the edge nearest the builder. `cells` is the
# brick's footprint [col0, row0, col1, row1], inclusive: the layout as drawn; a round plate covers its 4x4 square but not the corner cells. Where the build sits on the
# plate is loose (step 1 says roughly where, so the rest fits); how the five bricks sit against each other is exact.
# Every step is two parts for the wearer: `find` (which brick to pick up) and, once they have it, `say` (where it
# goes). `where` and `checks` are what the brain checks a photo against. One vocabulary throughout: the plate as a
# picture lying in front of the wearer, up = the far edge, down = the near edge, left and right theirs, a brick
# vertical (long side up-down) or horizontal (left-right).

title = "LEGO fish on a baseplate"
plate = 16
number = 6

[[steps]]
part = "blue 2x6 brick"
name = "Blue 2x6, body"
color = "blue"
cells = [7, 7, 12, 8]
find = "Find the blue two-by-six: a long blue brick, two studs wide and six studs long."
say = "Lay it horizontally roughly in the middle of the plate, a little right of centre, leaving room on its left."
where = "the blue 2x6, horizontal (6 studs left-right, 2 up-down), roughly in the middle of the plate, a little right of centre; the fish needs four columns left of it and two right"
checks = [
  "it is horizontal and blue",
  "it lies roughly in the middle of the plate, with empty plate on every side",
  "there are at least four empty columns on its left",
]

[[steps]]
part = "dark grey 4x4 round plate"
name = "Dark grey round, head"
color = "dgrey"
cells = [3, 6, 6, 9]
find = "Find the dark grey round plate: a flat round dark grey piece, four studs across."
say = "Lay it against the left end of the blue brick, touching it, centred on it, so it reaches one row above and one below the blue brick."
where = "the dark grey 4x4 round plate, touching the left end of the blue brick, centred on it, reaching one row above and one row below the blue brick"
checks = [
  "it is the dark grey round plate",
  "it touches the left end of the blue brick",
  "it is centred on the blue brick, reaching one row above and one below it",
]

[[steps]]
part = "red 2x4 brick"
name = "Red 2x4, tail"
color = "red"
cells = [13, 6, 14, 9]
find = "Find a red two-by-four: a red brick, two studs wide and four studs long."
say = "Stand it vertically against the right end of the blue brick, touching it, reaching one row above and one below it."
where = "the red 2x4, vertical, touching the right end of the blue brick, centred on it, reaching one row above and one row below the blue brick"
checks = [
  "it is vertical and red",
  "it touches the right end of the blue brick",
  "it reaches one row above and one below the blue brick",
]

[[steps]]
part = "pink 2x4 brick"
name = "Pink 2x4, top fin"
color = "pink"
cells = [8, 5, 11, 6]
find = "Find the pink two-by-four: a pink brick, two studs wide and four studs long."
say = "Lay it horizontally on top of the blue brick, touching it, centred, with one blue stud free at each end."
where = "the pink 2x4, horizontal, touching the top of the blue brick, centred on it, one blue column free at each end"
checks = [
  "it is horizontal and pink",
  "it touches the top of the blue brick",
  "it is centred on the blue brick, one blue column free at each end",
]

[[steps]]
part = "lavender 2x4 brick"
name = "Lavender 2x4, bottom fin"
color = "lav"
cells = [8, 9, 11, 10]
find = "Find the lavender two-by-four: a lavender brick, two studs wide and four studs long."
say = "Lay it horizontally under the blue brick, touching it, right below the pink one."
where = "the lavender 2x4, horizontal, touching the bottom of the blue brick, in the same columns as the pink brick"
checks = [
  "it is horizontal and lavender",
  "it touches the bottom of the blue brick",
  "it is in the same columns as the pink brick",
]
