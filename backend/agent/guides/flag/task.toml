# A flag: a white and a tan 1x6 for the pole, a red and a blue 2x4 for the flag, a dark grey 2x6 for the base. From tasks/sheet.html, task 2.
#
# Each step: `name` for the step list on the glasses; `brick`, which brick; `place`, where it goes, against the bricks
# before it (step 1 only roughly on the plate). Both models get `brick` and `place`. `cells` is the brick's footprint
# as drawn on the sheet, [col0, row0, col1, row1] inclusive, columns 1..16 left to right, rows 1..16 from the far
# edge; it goes to no model. Directions: the plate as a picture lying in front of the wearer, up = the far
# edge; vertical = the long side runs up and down.

title = "LEGO flag on a baseplate"
plate = 16
number = 2

[[steps]]
name = "White 1x6, top of pole"
brick = "white 1x6"
place = "vertical, near the top left of the plate, at most two empty rows above it and at least three empty columns on its left"
cells = [5, 3, 5, 8]

[[steps]]
name = "Tan 1x6, bottom of pole"
brick = "tan 1x6"
place = "vertical, below the white brick, touching its bottom end, in the same column"
cells = [5, 9, 5, 14]

[[steps]]
name = "Red 2x4, top of flag"
brick = "red 2x4"
place = "horizontal, touching the right side of the white brick, its top edge level with the white brick's top end"
cells = [6, 3, 9, 4]

[[steps]]
name = "Blue 2x4, bottom of flag"
brick = "blue 2x4"
place = "horizontal, below the red brick, touching it, in the same columns"
cells = [6, 5, 9, 6]

[[steps]]
name = "Dark grey 2x6, base"
brick = "dark grey 2x6"
place = "horizontal, touching the bottom end of the tan brick, three of its columns left of the tan brick and two right"
cells = [2, 15, 7, 16]
