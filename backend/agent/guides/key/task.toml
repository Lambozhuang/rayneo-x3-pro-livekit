# A key: a tan 2x6 shaft, a blue 4x4 round bow, a red and a purple 2x4 for the teeth, a pink 2x4 under the bow. From tasks/sheet.html (the 5-step shortlist), task 8.
#
# Grid: columns 1..16 left to right, rows 1..16 from the far edge to the edge nearest the builder. `cells` is the
# brick's footprint [col0, row0, col1, row1], inclusive: the layout as drawn; a round plate covers its 4x4 square but not the corner cells. Where the build sits on the
# plate is loose (step 1 says roughly where, so the rest fits); how the five bricks sit against each other is exact.
# Every step is two parts for the wearer: `find` (which brick to pick up) and, once they have it, `say` (where it
# goes). `where` and `checks` are what the brain checks a photo against. One vocabulary throughout: the plate as a
# picture lying in front of the wearer, up = the far edge, down = the near edge, left and right theirs, a brick
# vertical (long side up-down) or horizontal (left-right).

title = "LEGO key on a baseplate"
plate = 16
number = 8

[[steps]]
part = "tan 2x6 brick"
name = "Tan 2x6, shaft"
color = "tan"
cells = [7, 7, 12, 8]
find = "Find the tan two-by-six: a long tan brick, two studs wide and six studs long."
say = "Lay it horizontally roughly in the middle of the plate, a little right of centre, leaving room on its left and below it."
where = "the tan 2x6, horizontal (6 studs left-right, 2 up-down), roughly in the middle of the plate, a little right of centre; the key needs four columns left of it and four rows below it"
checks = [
  "it is horizontal and tan",
  "it lies roughly in the middle of the plate, with empty plate on every side",
  "there are at least four empty columns on its left and four empty rows below it",
]

[[steps]]
part = "blue 4x4 round plate"
name = "Blue round, bow"
color = "blue"
cells = [3, 6, 6, 9]
find = "Find the blue round plate: a flat round blue piece, four studs across."
say = "Lay it against the left end of the tan brick, touching it, centred on it, so it reaches one row above and one below the tan brick."
where = "the blue 4x4 round plate, touching the left end of the tan brick, centred on it, reaching one row above and one row below the tan brick"
checks = [
  "it is the blue round plate",
  "it touches the left end of the tan brick",
  "it is centred on the tan brick, reaching one row above and one below it",
]

[[steps]]
part = "red 2x4 brick"
name = "Red 2x4, tooth"
color = "red"
cells = [11, 9, 12, 12]
find = "Find a red two-by-four: a red brick, two studs wide and four studs long."
say = "Stand it vertically under the tan brick, touching it, with its right side lined up with the tan brick's right end."
where = "the red 2x4, vertical, touching the bottom of the tan brick, its right side lined up with the tan brick's right end"
checks = [
  "it is vertical and red",
  "it touches the bottom of the tan brick",
  "its right side lines up with the right end of the tan brick",
]

[[steps]]
part = "purple 2x4 brick"
name = "Purple 2x4, tooth"
color = "purple"
cells = [8, 9, 9, 12]
find = "Find the purple two-by-four: a purple brick, two studs wide and four studs long."
say = "Stand it vertically under the tan brick, touching it, with one empty column between it and the red one."
where = "the purple 2x4, vertical, touching the bottom of the tan brick, one empty column between it and the red brick, its ends level with the red brick's"
checks = [
  "it is vertical and purple",
  "it touches the bottom of the tan brick",
  "there is one empty column between it and the red brick, and its ends line up with the red brick's",
]

[[steps]]
part = "pink 2x4 brick"
name = "Pink 2x4, under the bow"
color = "pink"
cells = [3, 10, 6, 11]
find = "Find the pink two-by-four: a pink brick, two studs wide and four studs long."
say = "Lay it horizontally under the blue round plate, touching it, lined up with it."
where = "the pink 2x4, horizontal, touching the bottom of the blue round plate, in the same columns"
checks = [
  "it is horizontal and pink",
  "it touches the bottom of the blue round plate",
  "it is in the same columns as the blue round plate",
]
