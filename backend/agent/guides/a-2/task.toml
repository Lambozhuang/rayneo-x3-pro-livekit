# Game A of the user study, "pick the brick", trial 2 of 6 (gpt/pick.py; the spec is the study's game-spec.md outside the
# repo, revised after the first lab pilot of 2026-11-09). Five 2x4 bricks lie loose on the table, one of each of red, blue,
# purple, pink and white; the agent names a colour, the user picks a brick up, right or wrong, and holds it over the table,
# the Decisions line says whether it is the one, twice; then the user asks what colour the first brick they picked was.
# Each step is one pick: `brick` is the colour named, `name` is what the step list on the glasses shows, which does not
# give the colour away. The six trials name six different pairs; the first four trials are the console's experiment
# runs 1 to 4, the last two its training runs 1 and 2 (Lab.kt). No pictures: `game = "pick"` has nothing to show.

game = "pick"
title = "Pick the brick, trial 2"
number = 202

[[steps]]
name = "Brick 1"
brick = "blue 2x4"
place = ""
color = "#1e5bc6"

[[steps]]
name = "Brick 2"
brick = "purple 2x4"
place = ""
color = "#5a2d91"
