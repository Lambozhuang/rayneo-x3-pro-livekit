# A first build: two bricks flat on a baseplate. One layer, no stacking.
# Each step is what to pick up, what to tell the wearer, what the baseplate
# must hold when the step is done (`plate`: compared in code against the
# bricks the model reports), and the relations between them (`check`: judged
# by the model). The agent holds the position in this list; the model sees one
# step at a time through the tools in src/tools.py.

title = "Two bricks on a baseplate"
goal = "A blue 1x4 and a white 1x6 lying flat on a 16x16 baseplate, horizontal and parallel, the white one two rows below the blue one with their left ends aligned."

[[steps]]
part = "blue 1x4 brick"
say = "Take the blue one-by-four brick and press it flat onto the baseplate, horizontal, somewhere around the middle."
plate = [{ color = "blue", size = "1x4", orientation = "horizontal" }]
check = "The blue brick lies roughly in the middle of the baseplate."

[[steps]]
part = "white 1x6 brick"
say = "Now the white one-by-six. Put it below the blue brick, also horizontal, with two empty rows of studs between them, and line up its left end with the left end of the blue brick."
plate = [
  { color = "blue", size = "1x4", orientation = "horizontal" },
  { color = "white", size = "1x6", orientation = "horizontal" },
]
check = "The white brick is below the blue one and parallel to it, with exactly two empty rows of studs between them, and their left ends are in the same column, so the white brick sticks out two studs further to the right."

[[steps]]
part = "blue 1x4 brick"
say = "Last step: take the blue brick off again and put it back vertical, touching the right end of the white brick, so the two bricks make an L."
plate = [
  { color = "white", size = "1x6", orientation = "horizontal" },
  { color = "blue", size = "1x4", orientation = "vertical" },
]
check = "The blue brick stands at the right end of the white brick, touching it, so the two form an L."
