# A first build: two bricks flat on a baseplate. One layer, no stacking.
# Each step is what to pick up and what to tell the wearer. The agent holds the
# position in this list; the model sees one step at a time through the tools in
# src/tools.py and judges from the camera when a step is done.

title = "Two bricks on a baseplate"

[[steps]]
part = "blue 1x4 brick"
say = "Take the blue one-by-four brick and press it flat onto the baseplate, horizontal, somewhere around the middle."

[[steps]]
part = "white 1x6 brick"
say = "Now the white one-by-six. Put it below the blue brick, also horizontal, with two empty rows of studs between them, and line up its left end with the left end of the blue brick."

[[steps]]
part = "blue 1x4 brick"
say = "Last step: take the blue brick off again and put it back vertical, touching the right end of the white brick and pointing up, so the two bricks make an L."
