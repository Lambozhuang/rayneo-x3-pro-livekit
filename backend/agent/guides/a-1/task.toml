# Game A of the user study, "pick the brick", trial 1 of 6 (gpt/pick.py; the spec is the study's game-spec.md outside the
# repo). A tray holds one 2x4 brick of each of seven colours; the agent names a colour, the user holds that brick up, the
# Decisions line says whether it is the one, six times, then the user asks which bricks they picked. Each step is one
# pick: `brick` is the colour named, `name` is what the step list on the glasses shows, which does not give the colour
# away. The six trials name six of the seven colours each, in the tray's order rotated by the trial, so every trial leaves
# out a different colour; the first four trials are the console's experiment runs 1 to 4, the last two its training runs
# 1 and 2 (Lab.kt). No pictures: `game = "pick"` has nothing to show.

game = "pick"
title = "Pick the brick, trial 1"
number = 201

[[steps]]
name = "Brick 1"
brick = "red 2x4"
place = ""
color = "#c8102e"

