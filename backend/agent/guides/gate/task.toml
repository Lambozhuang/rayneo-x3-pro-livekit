# A gate: a blue and a dark grey 2x6 for the posts, a dark red 2x6 across the top, a white and a tan 1x6 for the ground. From tasks/sheet.html (the 5-step shortlist), task 7.
#
# Grid: columns 1..16 left to right, rows 1..16 from the far edge to the edge nearest the builder. `cells` is the
# brick's footprint [col0, row0, col1, row1], inclusive: the layout as drawn. Where the build sits on the
# plate is loose (step 1 says roughly where, so the rest fits); how the five bricks sit against each other is exact.
# Every step is two parts for the wearer: `find` (which brick to pick up) and, once they have it, `place` (where it
# goes). `where` and `checks` are what the brain checks a photo against. One vocabulary throughout: the plate as a
# picture lying in front of the wearer, up = the far edge, down = the near edge, left and right theirs, a brick
# vertical (long side up-down) or horizontal (left-right).

title = "LEGO gate on a baseplate"
plate = 16
number = 7

[[steps]]
part = "blue 2x6 brick"
name = "Blue 2x6, left post"
color = "blue"
cells = [5, 5, 6, 10]
find = "Find the blue two-by-six: a long blue brick, two studs wide and six studs long."
place = "Lay it vertically roughly in the middle of the plate, a little left of centre."
where = "the blue 2x6, vertical (2 studs left-right, 6 up-down), roughly in the middle of the plate, a little left of centre; the gate needs three columns left of it and seven right"
checks = [
  "it is vertical and blue",
  "it lies roughly in the middle of the plate, with empty plate on every side and at least three empty columns on its left",
]

[[steps]]
part = "dark grey 2x6 brick"
name = "Dark grey 2x6, right post"
color = "dgrey"
cells = [9, 5, 10, 10]
find = "Find the dark grey two-by-six: a long dark grey brick, two studs wide and six studs long."
place = "Lay it vertically right of the blue one, level with it, with two empty columns between them."
where = "the dark grey 2x6, vertical, right of the blue brick, its ends lined up with the blue brick's, two empty columns between the two"
checks = [
  "it is vertical and dark grey",
  "its top and bottom ends line up with the blue brick's",
  "there are two empty columns between it and the blue brick",
]

[[steps]]
part = "dark red 2x6 brick"
name = "Dark red 2x6, top"
color = "dred"
cells = [5, 3, 10, 4]
find = "Find the dark red two-by-six: a long dark red brick, two studs wide and six studs long."
place = "Lay it horizontally across the tops of both posts, touching both, with its ends lined up with the posts' outer sides."
where = "the dark red 2x6, horizontal, touching the top ends of both posts, its left end lined up with the blue post's left side and its right end with the dark grey post's right side"
checks = [
  "it is horizontal and dark red",
  "it touches the top ends of both posts",
  "its left end lines up with the blue post's left side and its right end with the dark grey post's right side",
]

[[steps]]
part = "white 1x6 brick"
name = "White 1x6, ground left"
color = "white"
cells = [2, 11, 7, 11]
find = "Find a white one-by-six: a thin white brick, six studs long."
place = "Lay it horizontally under the blue post, touching its bottom end, with its right end one stud past the post, so most of it sticks out to the left."
where = "the white 1x6, horizontal, touching the bottom end of the blue post, its right end one column past the post's right side, three columns sticking out left of the post"
checks = [
  "it is horizontal and white",
  "it touches the bottom end of the blue post",
  "its right end sticks out one column past the right side of the blue post",
]

[[steps]]
part = "tan 1x6 brick"
name = "Tan 1x6, ground right"
color = "tan"
cells = [8, 11, 13, 11]
find = "Find the tan one-by-six: a thin tan brick, six studs long."
place = "Lay it horizontally right of the white one, touching its right end, in the same row, under the dark grey post."
where = "the tan 1x6, horizontal, touching the right end of the white brick, in the same row, touching the bottom end of the dark grey post"
checks = [
  "it is horizontal and tan",
  "it touches the right end of the white brick, in the same row",
  "it touches the bottom end of the dark grey post",
]
