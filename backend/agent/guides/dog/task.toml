# A dog: a red 2x4 head, a tan 2x6 body, a blue 1x4 tail, a yellow and a light aqua 1x4 for the legs. From tasks/sheet.html (the 5-step shortlist), task 11.
#
# Grid: columns 1..16 left to right, rows 1..16 from the far edge to the edge nearest the builder. `cells` is the
# brick's footprint [col0, row0, col1, row1], inclusive: the layout as drawn. Where the build sits on the
# plate is loose (step 1 says roughly where, so the rest fits); how the five bricks sit against each other is exact.
# Every step is two parts for the wearer: `find` (which brick to pick up) and, once they have it, `place` (where it
# goes). `where` and `checks` are what the brain checks a photo against. One vocabulary throughout: the plate as a
# picture lying in front of the wearer, up = the far edge, down = the near edge, left and right theirs, a brick
# vertical (long side up-down) or horizontal (left-right).

title = "LEGO dog on a baseplate"
plate = 16
number = 11

[[steps]]
part = "red 2x4 brick"
name = "Red 2x4, head"
color = "red"
cells = [4, 5, 5, 8]
find = "Find a red two-by-four: a red brick, two studs wide and four studs long."
place = "Stand it vertically roughly in the middle of the plate, a little left of centre, leaving plenty of room on its right."
where = "the red 2x4, vertical (2 studs left-right, 4 up-down), roughly in the middle of the plate, a little left of centre; the dog needs seven columns right of it and four rows below"
checks = [
  "it is vertical and red",
  "it lies roughly in the middle of the plate, left of centre, with empty plate on every side",
  "there are at least seven empty columns on its right",
]

[[steps]]
part = "tan 2x6 brick"
name = "Tan 2x6, body"
color = "tan"
cells = [6, 7, 11, 8]
find = "Find the tan two-by-six: a long tan brick, two studs wide and six studs long."
place = "Lay it horizontally against the right side of the red brick, touching it, with their bottom edges lined up."
where = "the tan 2x6, horizontal, touching the right side of the red brick, its bottom edge lined up with the red brick's bottom end"
checks = [
  "it is horizontal and tan",
  "it touches the right side of the red brick",
  "its bottom edge lines up with the bottom end of the red brick",
]

[[steps]]
part = "blue 1x4 brick"
name = "Blue 1x4, tail"
color = "blue"
cells = [12, 5, 12, 8]
find = "Find the blue one-by-four: a thin blue brick, four studs long."
place = "Stand it vertically against the right end of the tan brick, touching it, with their bottom edges lined up, so it sticks up above the tan brick."
where = "the blue 1x4, vertical, touching the right end of the tan brick, its bottom end lined up with the tan brick's bottom edge, sticking up two rows above the tan brick"
checks = [
  "it is vertical and blue",
  "it touches the right end of the tan brick",
  "its bottom end lines up with the bottom edge of the tan brick",
]

[[steps]]
part = "yellow 1x4 brick"
name = "Yellow 1x4, front leg"
color = "yellow"
cells = [6, 9, 6, 12]
find = "Find the yellow one-by-four: a thin yellow brick, four studs long."
place = "Stand it vertically under the left end of the tan brick, touching it, lined up with the tan brick's left end."
where = "the yellow 1x4, vertical, touching the bottom of the tan brick at its left end, lined up with the tan brick's left end"
checks = [
  "it is vertical and yellow",
  "it touches the bottom of the tan brick",
  "it lines up with the left end of the tan brick",
]

[[steps]]
part = "light aqua 1x4 brick"
name = "Aqua 1x4, back leg"
color = "aqua"
cells = [11, 9, 11, 12]
find = "Find the light aqua one-by-four: a thin light aqua brick, four studs long."
place = "Stand it vertically under the right end of the tan brick, touching it, lined up with the tan brick's right end."
where = "the light aqua 1x4, vertical, touching the bottom of the tan brick at its right end, lined up with the tan brick's right end"
checks = [
  "it is vertical and light aqua, not white",
  "it touches the bottom of the tan brick",
  "it lines up with the right end of the tan brick",
]
