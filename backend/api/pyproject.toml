[project]
name = "rayneo-x3-pro-api"
version = "0.1.0"
description = "Token endpoint for the RayNeo X3 Pro assistant: authenticates the glasses and signs LiveKit join tokens"
requires-python = ">=3.10"
dependencies = [
    "aiohttp~=3.14",
    # Signs the join tokens. Brings PyJWT, which auth.py uses for AUTH_MODE=jwt.
    "livekit-api~=1.0",
    "pyjwt~=2.9",
    "python-dotenv~=1.0",
]

[tool.uv]
package = false
