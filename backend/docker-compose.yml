# The whole backend: livekit-server, api, agent. Linux host.
#
# Everything runs with host networking. WebRTC media needs livekit-server's
# UDP ports reachable at the address it advertises, and a bridge network puts
# NAT and the host firewall (ufw on both machines we run this on) between the
# glasses and the SFU. On the host's own stack there is nothing to get wrong:
# the server binds the LAN address, the api listens on API_PORT directly, and
# the two services reach the server on loopback.
#
#   cp deploy/livekit.lab.yaml livekit.yaml   # then put a real key pair in (deploy/setup.sh does this)
#   cd backend && docker compose up -d --build
#
# All settings come from ./.env (copy .env.example). AUTH_MODE decides who may
# start a session; see api/src/auth.py.

services:
  livekit:
    image: livekit/livekit-server:v1.13.7
    network_mode: host
    # ../livekit.yaml is gitignored: it holds the real key pair. Template:
    # deploy/livekit.lab.yaml.
    volumes:
      - ../livekit.yaml:/livekit.yaml:ro
    command: --config /livekit.yaml --bind 0.0.0.0
    restart: unless-stopped

  api:
    build: ./api
    network_mode: host
    env_file: .env
    environment:
      # With host networking there is no port mapping: the api listens on
      # API_PORT from .env itself, on every interface.
      API_HOST: "0.0.0.0"
      # GET /tasks lists the numbered task files here; the glasses pick one.
      GUIDES_DIR: /guides
    volumes:
      - ./agent/guides:/guides:ro
    depends_on:
      - livekit
    restart: unless-stopped

  agent:
    build:
      context: ./agent
      # The commit the image is built from, for each call's record:
      #   GIT_COMMIT=$(git describe --always --dirty) docker compose up -d --build
      args:
        GIT_COMMIT: ${GIT_COMMIT:-}
    network_mode: host
    env_file: .env
    environment:
      # One record per call (runlog.py): backend/runs/<call>/ on the host; deploy/report.py makes the page.
      RUN_DIR: /app/runs
      # The driver libraries the nvidia runtime mounts into the container: `video` brings libnvcuvid, the NVDEC
      # library, which the default (compute, utility) leaves out. The setting replaces the default, so all three.
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
    # The agent is dispatched into rooms by livekit-server and talks to its model
    # outbound; nothing needs to reach it. Its worker health port (8081) is on
    # the host stack too but stays behind ufw.
    depends_on:
      - livekit
    volumes:
      # the call records, gitignored
      - ./runs:/app/runs
      # Guides are baked into the image; this mount lets you edit one and
      # `docker compose restart agent` without a rebuild.
      - ./agent/guides:/app/guides
    # The glasses send H.265, which the agent's libwebrtc decodes only on an NVIDIA GPU (NVDEC, camera.py); it has
    # no software H.265 decoder. Docker needs the nvidia runtime for this (README, Setting up a new server).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
