# What each study frame shows, read by a person from the 1080 square (out/sq1080), in the probe's own words.
#
# The rule for every frame: a label says only what this frame shows. A brick's size, orientation or relation that a
# hand covers is "can't tell", and the right reply writes hidden there too; a definite value for a hidden item is a guess
# and counts as wrong even when it happens to match the brick. A brick wholly under a hand has no line, and a reply
# that gives it one with definite values is marked down. A brick the hand still holds on the plate is marked
# held = true; a reply may list it among the bricks or mention it in its Hands line.
#
# hands: none = no hand on or over the plate (a hand elsewhere in the picture does not count); over = a hand above
# the plate; on = a hand on the plate or on a brick. hidden says in words what the hands cover; the sheet shows it as
# the Hands line of the expected reply.
# relation uses the direction words of the probe: up is the far edge, vertical is the long side up and down. Counts
# of empty rows and columns are read off a photo taken at an angle and are good to about one stud.
#
# f00, the recording's first frame, is left out: the camera had not yet set its exposure and the frame is dark
# (mean luminance 22 against about 100 for the rest). The wearer first placed a white 1x4, the wrong brick, and
# swapped it for the 1x6 at about 65 s; the dark grey base was first placed about two studs too far right (f33–f35)
# and moved at about 210 s.

