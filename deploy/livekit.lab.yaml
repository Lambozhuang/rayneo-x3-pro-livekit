# livekit-server for the lab: one PC on a private network with the glasses, no
# TLS, no NAT. deploy/setup.sh lab copies this to livekit.yaml at the repo root
# with a generated key pair and mirrors it into backend/.env; compose mounts
# that copy.
#
# Signaling is plain ws:// on 7880 and media uses the default UDP range, both
# straight to this machine's LAN IP. Set LIVEKIT_PUBLIC_URL=ws://<LAN IP>:7880
# in backend/.env so /getToken advertises the right address.

port: 7880

rtc:
  port_range_start: 50000
  port_range_end: 60000
  tcp_port: 7881
  use_external_ip: false

keys:
  # REPLACE: livekit-server generate-keys
  APIxxxxxxxx: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
