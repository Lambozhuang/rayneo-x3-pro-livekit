[project]
name = "rayneo-x3-pro-agent"
version = "0.1.0"
description = "Live AI assistant agent for RayNeo X3 Pro AR glasses"
requires-python = ">=3.10"
dependencies = [
    # aiohttp already arrives with livekit-agents; token_server.py imports it
    # directly, so declare it rather than lean on a transitive dependency.
    "aiohttp~=3.14",
    "livekit-agents[google]~=1.5",
    "python-dotenv~=1.0",
]

[tool.uv]
package = false
